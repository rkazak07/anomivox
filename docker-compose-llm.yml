version: "3.9"

services:
  llm:
    image: ollama/ollama:latest
    container_name: llm
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_NUM_PARALLEL=1
      - OLLAMA_MAX_LOADED_MODELS=1
      - OLLAMA_KEEP_ALIVE=5m
    entrypoint: >
      /bin/sh -c "
      ollama serve &
      sleep 5 &&
      ollama pull llama3:8b &&
      ollama pull sqlserver:latest &&
      wait
      "

volumes:
  ollama_data:
