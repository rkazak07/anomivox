services:

  # ─────────────────────────────────────────────
  # Ana Uygulama Servisleri
  # ─────────────────────────────────────────────

  api:
    build: .
    environment:
      APP_MODE: api
      DB_TYPE: postgresql
      PG_USER: ${POSTGRES_USER:-test}
      PG_PASSWORD: ${POSTGRES_PASSWORD:-Test123_456}
      PG_HOST: postgres_db
      PG_PORT: 5432
      PG_DB: ${POSTGRES_DB:-anomivox}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      # AI Agent Gateway (Docker iç ağ)
      OPENCLAW_GATEWAY_HOST: ai-agent
      OPENCLAW_GATEWAY_PORT: "18789"
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN:-}
      OPENCLAW_CONFIG_DIR: /openclaw-config
    ports:
      - "7861:7861"
    volumes:
      - ./configs:/app/configs
      - ./chroma_db:/app/chroma_db
      - ./knowledge_base:/app/knowledge_base
      - ./logs_data:/app/logs
      - ./openclaw_data:/openclaw-config
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - agent_network
    depends_on:
      postgres_db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7861/docs"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  webui:
    build: .
    environment:
      APP_MODE: webui
      DB_TYPE: postgresql
      PG_USER: ${POSTGRES_USER:-test}
      PG_PASSWORD: ${POSTGRES_PASSWORD:-Test123_456}
      PG_HOST: postgres_db
      PG_PORT: 5432
      PG_DB: ${POSTGRES_DB:-anomivox}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      # Docker iç ağda API servisinin adresi (http:// olmadan, startup.py ekler)
      WEBUI_API_URL: api:7861
    ports:
      - "18501:18501"
    volumes:
      - ./configs:/app/configs
      - logs_data:/app/logs
      - ./webui/src:/app/webui/src
    networks:
      - agent_network
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  # ─────────────────────────────────────────────
  # İzleme Servisleri (prometheus_service_docker)
  # ─────────────────────────────────────────────

  prometheus:
    image: prom/prometheus
    volumes:
      - ./prometheus_service_docker/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus_service_docker/node_rules.yml:/usr/local/prometheus/rules/node_rules.yml:ro
      - ./prometheus_service_docker/pgsql_rules.yml:/usr/local/prometheus/rules/pgsql_rules.yml:ro
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    ports:
      - "9090:9090"
    networks:
      - agent_network
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager
    volumes:
      - ./prometheus_service_docker/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
    ports:
      - "9093:9093"
    networks:
      - agent_network
    restart: unless-stopped

  postgres_db:
    image: postgres:12.11
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-test}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-Test123_456}
      POSTGRES_DB: ${POSTGRES_DB:-anomivox}
      POSTGRES_PORT: 5432
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - agent_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-test}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  node_exporter:
    image: prom/node-exporter
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.ignored-mount-points=^/(sys|proc|dev|host|etc)($$|/)'
    ports:
      - "9100:9100"
    networks:
      - agent_network
    restart: unless-stopped

  pg_exporter:
    image: vonng/pg_exporter:v0.6.1
    environment:
      PG_EXPORTER_URL: "postgresql://${POSTGRES_USER:-test}:${POSTGRES_PASSWORD:-Test123_456}@postgres_db:5432/${POSTGRES_DB:-anomivox}?sslmode=disable"
    ports:
      - "9187:9630"
    networks:
      - agent_network
    depends_on:
      postgres_db:
        condition: service_healthy
    restart: unless-stopped

  # Prometheus anomali alert kayıt uygulaması
  # Ana image kullanılıyor: prometheus_service_docker/app.py,
  # proje kökündeki configs modülünü import ettiği için aynı image gerekli.
  notify-worker:
    build: .
    environment:
      APP_MODE: python_app
      PYTHONPATH: /app
      # AI Agent entegrasyonu — alert bildirimleri
      OPENCLAW_GATEWAY_URL: http://openclaw:18789
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN:-}
      OPENCLAW_NOTIFY_ENABLED: "true"
      # Telegram Bot API — alert bildirimleri
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_ADMIN_CHAT_ID: ${TELEGRAM_ADMIN_CHAT_ID:-}
      TELEGRAM_CHAT_IDS: ${TELEGRAM_CHAT_IDS:-}
      # Prometheus
      PROMETHEUS_URL: http://prometheus:9090
      # Multi-DB — diagnostik sorgular için
      DB_TYPE: ${DB_TYPE:-postgresql}
      DB_HOST: ${DB_HOST:-postgres_db}
      DB_PORT: ${DB_PORT:-5432}
      DB_USER: ${DB_USER:-${POSTGRES_USER:-test}}
      DB_PASSWORD: ${DB_PASSWORD:-${POSTGRES_PASSWORD:-Test123_456}}
      DB_NAME: ${DB_NAME:-${POSTGRES_DB:-anomivox}}
      DB_SERVICE_NAME: ${DB_SERVICE_NAME:-}
      # Legacy uyumluluk
      PG_HOST: ${DB_HOST:-postgres_db}
      PG_PORT: ${DB_PORT:-5432}
      PG_USER: ${DB_USER:-${POSTGRES_USER:-test}}
      PG_PASSWORD: ${DB_PASSWORD:-${POSTGRES_PASSWORD:-Test123_456}}
      PG_DB: ${DB_NAME:-${POSTGRES_DB:-anomivox}}
    volumes:
      - ./configs:/app/configs
    ports:
      - "8023:8023"
    networks:
      - agent_network
    depends_on:
      postgres_db:
        condition: service_healthy
    restart: unless-stopped

  # ─────────────────────────────────────────────
  # AI Agent — Kişisel AI Asistanı (Gateway)
  # ─────────────────────────────────────────────
  # Telegram, WhatsApp, Discord, Slack vb. tüm
  # kanal yönetimi AI Agent Gateway üzerinden yapılır.
  # Daha fazla bilgi: https://docs.openclaw.ai
  # ─────────────────────────────────────────────

  ai-agent:
    build:
      context: .
      dockerfile: Dockerfile.openclaw
    environment:
      NODE_ENV: production
      # ── AI Agent Paths ──
      OPENCLAW_HOME: /home/node/.openclaw
      OPENCLAW_STATE_DIR: /home/node/.openclaw
      OPENCLAW_CONFIG_PATH: /home/node/.openclaw/openclaw.json
      # ── Gateway Ayarları ──
      OPENCLAW_GATEWAY_PORT: "18789"
      OPENCLAW_GATEWAY_BIND: ${OPENCLAW_GATEWAY_BIND:-lan}
      OPENCLAW_GATEWAY_MODE: ${OPENCLAW_GATEWAY_MODE:-local}
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN:-}
      # ── Model ──
      OPENCLAW_MODEL: ${OPENCLAW_MODEL:-groq/llama-3.3-70b-versatile}
      # ── LLM Provider API Keys ──
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      # ── Kanal Tokenları (ilk kurulumda config'e yazılır) ──
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN:-}
      SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN:-}
      SLACK_APP_TOKEN: ${SLACK_APP_TOKEN:-}
    ports:
      - "18789:18789"
    volumes:
      - openclaw_data:/home/node/.openclaw
      - openclaw_workspace:/home/node/.openclaw/workspace
    networks:
      - agent_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:18789/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

# ─────────────────────────────────────────────
# Kalıcı Veri Volumeleri
# ─────────────────────────────────────────────
volumes:
  chroma_data:
  kb_data:
  logs_data:
  pg_data:
  openclaw_data:
  openclaw_workspace:

# ─────────────────────────────────────────────
# Ağ
# ─────────────────────────────────────────────
networks:
  agent_network:
    driver: bridge
