services:

  # ─────────────────────────────────────────────
  # Ana Uygulama Servisleri
  # ─────────────────────────────────────────────

  api:
    build: .
    environment:
      APP_MODE: api
      DB_TYPE: postgresql
      PG_USER: ${POSTGRES_USER:-test}
      PG_PASSWORD: ${POSTGRES_PASSWORD:-Test123_456}
      PG_HOST: postgres_db
      PG_PORT: 5432
      PG_DB: ${POSTGRES_DB:-anomivox}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      HF_HUB_OFFLINE: "0"
      TRANSFORMERS_OFFLINE: "0"
      # LiteLLM Proxy bağlantısı (model yönetim UI için)
      LITELLM_BASE_URL: http://litellm-proxy:4000
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-anomivox-local}
      # DBA Agent bağlantısı
      DBA_AGENT_URL: http://dba-agent:8100
    ports:
      - "7861:7861"
    volumes:
      - ./configs:/app/configs
      - ./chroma_db:/app/chroma_db
      - ./knowledge_base:/app/knowledge_base
      - logs_data:/app/logs
      - ./litellm_config.yaml:/app/litellm_config.yaml
    networks:
      - agent_network
    depends_on:
      postgres_db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7861/docs"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  webui:
    build: .
    environment:
      APP_MODE: webui
      DB_TYPE: postgresql
      PG_USER: ${POSTGRES_USER:-test}
      PG_PASSWORD: ${POSTGRES_PASSWORD:-Test123_456}
      PG_HOST: postgres_db
      PG_PORT: 5432
      PG_DB: ${POSTGRES_DB:-anomivox}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      # Docker iç ağda API servisinin adresi (http:// olmadan, startup.py ekler)
      WEBUI_API_URL: api:7861
    ports:
      - "18501:18501"
    volumes:
      - ./configs:/app/configs
      - logs_data:/app/logs
      - ./webui/src:/app/webui/src
    networks:
      - agent_network
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  # ─────────────────────────────────────────────
  # İzleme Servisleri (prometheus_service_docker)
  # ─────────────────────────────────────────────

  prometheus:
    image: prom/prometheus
    volumes:
      - ./prometheus_service_docker/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus_service_docker/node_rules.yml:/usr/local/prometheus/rules/node_rules.yml:ro
      - ./prometheus_service_docker/pgsql_rules.yml:/usr/local/prometheus/rules/pgsql_rules.yml:ro
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    ports:
      - "9090:9090"
    networks:
      - agent_network
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager
    volumes:
      - ./prometheus_service_docker/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
    ports:
      - "9093:9093"
    networks:
      - agent_network
    restart: unless-stopped

  postgres_db:
    image: postgres:12.11
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-test}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-Test123_456}
      POSTGRES_DB: ${POSTGRES_DB:-anomivox}
      POSTGRES_PORT: 5432
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - agent_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-test}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  node_exporter:
    image: prom/node-exporter
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.ignored-mount-points=^/(sys|proc|dev|host|etc)($$|/)'
    ports:
      - "9100:9100"
    networks:
      - agent_network
    restart: unless-stopped

  pg_exporter:
    image: vonng/pg_exporter:v0.6.1
    environment:
      PG_EXPORTER_URL: "postgresql://${POSTGRES_USER:-test}:${POSTGRES_PASSWORD:-Test123_456}@postgres_db:5432/${POSTGRES_DB:-anomivox}?sslmode=disable"
    ports:
      - "9187:9630"
    networks:
      - agent_network
    depends_on:
      postgres_db:
        condition: service_healthy
    restart: unless-stopped

  # Prometheus anomali alert kayıt uygulaması
  # Ana image kullanılıyor: prometheus_service_docker/app.py,
  # proje kökündeki configs modülünü import ettiği için aynı image gerekli.
  notify-worker:
    build: .
    environment:
      APP_MODE: python_app
      PYTHONPATH: /app
      # DBA Agent entegrasyonu — alert bildirimleri
      DBA_AGENT_URL: http://dba-agent:8100
      DBA_AGENT_NOTIFY_ENABLED: "true"
      # Telegram Bot API — alert bildirimleri
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_ADMIN_CHAT_ID: ${TELEGRAM_ADMIN_CHAT_ID:-}
      TELEGRAM_CHAT_IDS: ${TELEGRAM_CHAT_IDS:-}
      # Prometheus
      PROMETHEUS_URL: http://prometheus:9090
      # Multi-DB — diagnostik sorgular için
      DB_TYPE: ${DB_TYPE:-postgresql}
      DB_HOST: ${DB_HOST:-postgres_db}
      DB_PORT: ${DB_PORT:-5432}
      DB_USER: ${DB_USER:-${POSTGRES_USER:-test}}
      DB_PASSWORD: ${DB_PASSWORD:-${POSTGRES_PASSWORD:-Test123_456}}
      DB_NAME: ${DB_NAME:-${POSTGRES_DB:-anomivox}}
      DB_SERVICE_NAME: ${DB_SERVICE_NAME:-}
      # Legacy uyumluluk
      PG_HOST: ${DB_HOST:-postgres_db}
      PG_PORT: ${DB_PORT:-5432}
      PG_USER: ${DB_USER:-${POSTGRES_USER:-test}}
      PG_PASSWORD: ${DB_PASSWORD:-${POSTGRES_PASSWORD:-Test123_456}}
      PG_DB: ${DB_NAME:-${POSTGRES_DB:-anomivox}}
    volumes:
      - ./configs:/app/configs
    ports:
      - "8023:8023"
    networks:
      - agent_network
    depends_on:
      postgres_db:
        condition: service_healthy
    restart: unless-stopped

  # ─────────────────────────────────────────────
  # AI Agent Gateway — Model Routing & Fallback
  # ─────────────────────────────────────────────
  # LLM çağrılarını Ollama'ya yönlendirir.
  # Retry, fallback, timeout, cache yönetimi sağlar.
  # ─────────────────────────────────────────────

  ai-agent-gateway:
    image: ghcr.io/berriai/litellm:main-latest
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-anomivox-local}
      LITELLM_LOG_LEVEL: INFO
    volumes:
      - ./litellm_config.yaml:/app/config.yaml:ro
    ports:
      - "4000:4000"
    command: ["--config", "/app/config.yaml", "--port", "4000", "--host", "0.0.0.0"]
    networks:
      - agent_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import socket; s=socket.socket(); s.settimeout(3); s.connect(('127.0.0.1',4000)); s.close()\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ─────────────────────────────────────────────
  # DBA Agent — Otonom Veritabanı Yönetim Agent'ı
  # ─────────────────────────────────────────────
  # Python tabanlı, LiteLLM üzerinden Ollama ile çalışır.
  # Mevcut sisteme (API, WebUI, KB) DOKUNMAZ.
  # ─────────────────────────────────────────────

  dba-agent:
    build:
      context: .
      dockerfile: Dockerfile.dba-agent
    environment:
      # ── Inference ──
      LITELLM_BASE_URL: http://ai-agent-gateway:4000
      LITELLM_API_KEY: ${LITELLM_MASTER_KEY:-sk-anomivox-local}
      OLLAMA_BASE_URL: http://localhost:11434
      DBA_REASONING_MODEL: ollama/llama3.1:8b
      DBA_SQL_MODEL: ollama/sqlcoder:latest
      DBA_TRIAGE_MODEL: ollama/llama3.2:1b
      DBA_FALLBACK_MODEL: ollama/llama3:8b
      # ── Veritabanı (monitör edilen) ──
      DB_TYPE: ${DB_TYPE:-postgresql}
      DB_HOST: postgres_db
      DB_PORT: "5432"
      DB_USER: ${POSTGRES_USER:-test}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-Test123_456}
      DB_NAME: ${POSTGRES_DB:-anomivox}
      # ── Telegram ──
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_ADMIN_CHAT_ID: ${TELEGRAM_ADMIN_CHAT_ID:-}
      TELEGRAM_CHAT_IDS: ${TELEGRAM_CHAT_IDS:-}
      # ── SSH (OS Monitoring) ──
      DBA_SSH_HOST: ${DBA_SSH_HOST:-}
      DBA_SSH_USER: ${DBA_SSH_USER:-anomivox}
      DBA_SSH_PORT: ${DBA_SSH_PORT:-22}
      DBA_SSH_KEY_PATH: ${DBA_SSH_KEY_PATH:-}
      DBA_SSH_NAME: ${DBA_SSH_NAME:-db-server}
      DBA_SSH_ROLE: ${DBA_SSH_ROLE:-database}
      DBA_SSH_ALLOWED_SERVICES: ${DBA_SSH_ALLOWED_SERVICES:-postgresql,mysql,nginx,docker}
      DBA_SSH_TIMEOUT: ${DBA_SSH_TIMEOUT:-30}
      # ── Prometheus ──
      PROMETHEUS_URL: http://prometheus:9090
      # ── Agent Ayarları ──
      DBA_AGENT_LANGUAGE: tr
      DBA_LOG_LEVEL: INFO
      DBA_AUTO_DIAGNOSE: "true"
    ports:
      - "8100:8100"
    volumes:
      - ./configs:/app/configs:ro
      - logs_data:/app/logs
      - ${DBA_SSH_KEY_DIR:-~/.ssh}:/root/.ssh:ro
    networks:
      - agent_network
    depends_on:
      postgres_db:
        condition: service_healthy
      ai-agent-gateway:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8100/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

# ─────────────────────────────────────────────
# Kalıcı Veri Volumeleri
# ─────────────────────────────────────────────
volumes:
  chroma_data:
  kb_data:
  logs_data:
  pg_data:

# ─────────────────────────────────────────────
# Ağ
# ─────────────────────────────────────────────
networks:
  agent_network:
    driver: bridge
