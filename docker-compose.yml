services:

  # ─────────────────────────────────────────────
  # Ana Uygulama Servisleri
  # ─────────────────────────────────────────────

  api:
    build: .
    environment:
      APP_MODE: api
      DB_TYPE: postgresql
      PG_USER: ${POSTGRES_USER:-test}
      PG_PASSWORD: ${POSTGRES_PASSWORD:-Test123_456}
      PG_HOST: postgres_db
      PG_PORT: 5432
      PG_DB: ${POSTGRES_DB:-anomivox}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    ports:
      - "7861:7861"
    volumes:
      - ./configs:/app/configs
      - chroma_data:/app/chroma_db
      - kb_data:/app/knowledge_base
      - logs_data:/app/logs
    networks:
      - agent_network
    depends_on:
      postgres_db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7861/docs"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  webui:
    build: .
    environment:
      APP_MODE: webui
      DB_TYPE: postgresql
      PG_USER: ${POSTGRES_USER:-test}
      PG_PASSWORD: ${POSTGRES_PASSWORD:-Test123_456}
      PG_HOST: postgres_db
      PG_PORT: 5432
      PG_DB: ${POSTGRES_DB:-anomivox}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      # Docker iç ağda API servisinin adresi (http:// olmadan, startup.py ekler)
      WEBUI_API_URL: api:7861
    ports:
      - "18501:18501"
    volumes:
      - ./configs:/app/configs
      - logs_data:/app/logs
    networks:
      - agent_network
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  # ─────────────────────────────────────────────
  # İzleme Servisleri (prometheus_service_docker)
  # ─────────────────────────────────────────────

  prometheus:
    image: prom/prometheus
    volumes:
      - ./prometheus_service_docker/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus_service_docker/node_rules.yml:/usr/local/prometheus/rules/node_rules.yml:ro
      - ./prometheus_service_docker/pgsql_rules.yml:/usr/local/prometheus/rules/pgsql_rules.yml:ro
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    ports:
      - "9090:9090"
    networks:
      - agent_network
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager
    volumes:
      - ./prometheus_service_docker/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
    ports:
      - "9093:9093"
    networks:
      - agent_network
    restart: unless-stopped

  postgres_db:
    image: postgres:12.11
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-test}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-Test123_456}
      POSTGRES_DB: ${POSTGRES_DB:-anomivox}
      POSTGRES_PORT: 5432
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - agent_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-test}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  node_exporter:
    image: prom/node-exporter
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.ignored-mount-points=^/(sys|proc|dev|host|etc)($$|/)'
    ports:
      - "9100:9100"
    networks:
      - agent_network
    restart: unless-stopped

  pg_exporter:
    image: vonng/pg_exporter:v0.6.1
    environment:
      PG_EXPORTER_URL: "postgresql://${POSTGRES_USER:-test}:${POSTGRES_PASSWORD:-Test123_456}@postgres_db:5432/${POSTGRES_DB:-anomivox}?sslmode=disable"
    ports:
      - "9187:9187"
    networks:
      - agent_network
    depends_on:
      postgres_db:
        condition: service_healthy
    restart: unless-stopped

  # Prometheus anomali alert kayıt uygulaması
  # Ana image kullanılıyor: prometheus_service_docker/app.py,
  # proje kökündeki configs modülünü import ettiği için aynı image gerekli.
  python_app:
    build: .
    environment:
      APP_MODE: python_app
      PYTHONPATH: /app
    volumes:
      - ./configs:/app/configs
    ports:
      - "8023:8023"
    networks:
      - agent_network
    restart: unless-stopped

# ─────────────────────────────────────────────
# Kalıcı Veri Volumeleri
# ─────────────────────────────────────────────
volumes:
  chroma_data:
  kb_data:
  logs_data:
  pg_data:

# ─────────────────────────────────────────────
# Ağ
# ─────────────────────────────────────────────
networks:
  agent_network:
    driver: bridge
