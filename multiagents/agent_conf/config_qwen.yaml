max_turn: &max_turn 3

llm_type: Qwen1.5-14B-Chat

language: en

prompts:
  role_assigner_role_description: &role_assigner_role_description |-
    You are a role assigner. Your task is to select experts with diverse identities to correctly analyze the root cause of the given alert.

  role_assigner_prompt: &role_assigner_prompt |-
    You are the leader of a group of diagnosis experts. A database alert has been triggered. The alert information is:
    ${alert_info}

    You need to select experts with diverse identities to analyze the root cause of the alert. The names of available experts are:
    ${task_description}

    Please note that you can only select at most 3 experts. You can only reply with the names of selected experts, without including other information. Your reply must follow the format below:
    1. CpuExpert
    2. QueryExpert
    ...

  chief_dba_role_description: &chief_dba_role_description |-
    You are a Chief DBA with extensive database diagnosis experience. Your task is to analyze the root cause of anomalies together with other experts. Here is the outline of your tasks:
    1. Communicate with other experts and ask how to diagnose the root cause of the anomaly.
    2. Summarize the root cause of the fault and detailed solutions.
    Note, your answer must be concise and accurate.

#  chief_dba_format_prompt: &chief_dba_format_prompt |-

  expert_agent_role_description: &expert_agent_role_description |-
    You are a ${agent_name} and can use multiple tools for fault diagnosis.

    ## You have the following tools:

    ${tools}

    ## You can insert the following commands zero, one or multiple times in your reply to call tools:

    Thought: your thought
    Action: tool name, must be one of [${tool_names}]
    Action Input: tool input
    Observation: tool result
    ...
    Thought: I now know the final answer
    Final Answer: final answer to the original question


  expert_agent_format_prompt: &expert_agent_format_prompt |-
    A database alert has been triggered in the company. The specific content of the alert is:
    ${alert_info}

    -Your analysis must follow these steps:
    First use the tool "whether_is_abnormal_metric" to determine if there are any abnormal metrics.
    Then use the tool "match_diagnose_knowledge" for fault analysis.
    Based on the results of the above steps, if further diagnosis is possible, use tools to optimize queries or indexes. The tool name must be one of [${tool_choice}].
    Finally, based on all the above results, provide the final root cause and solution following the template below. Do not say anything extra. Final Answer is in dictionary format:
    Thought: I now know the root cause of the anomaly
    Final Answer: {"diagnose": "the root cause you diagnosed", "solution": "the optimal solution you found", "knowledge": "the diagnosis knowledge you referenced"}



monitor_tools: &monitor_tools
  - tool_name: metric_monitor

expert_tools: &expert_tools
  - tool_name: metric_monitor
  - tool_name: index_advisor
#-
#  tool_name: query_advisor


name: 8 DBAs with Tools

environment:
  env_type: dba
  max_turns: *max_turn
  rule:
    order:
      type: sequential
    visibility:
      type: all
    selector:
      type: basic
    updater:
      type: basic
    describer:
      type: basic

agents:
  - agent_type: reporter
    name: ChiefDBA
    role_description: *chief_dba_role_description
#    prompt_template: *chief_dba_format_prompt
    memory:
      memory_type: chat_history
    tool_memory:
      memory_type: chat_history
      llm:
        llm_type: feedback_qwen
      recursive: true
    llm:
      llm_type: feedback_qwen
    tools: *monitor_tools
    verbose: true
  - agent_type: role_assigner
    name: role assigner
    role_description: *role_assigner_role_description
    prompt_template: *role_assigner_prompt
    memory:
      memory_type: chat_history
    llm:
      llm_type: feedback_qwen
  - agent_type: solver
    output_parser: qwen_output_parser
    name: ${agent_name}
    role_description: *expert_agent_role_description
    prompt_template: *expert_agent_format_prompt
    memory:
      memory_type: chat_history
    tool_memory:
      memory_type: chat_history
      llm:
        llm_type: feedback_qwen
      recursive: true
    llm:
      llm_type: feedback_qwen
    tools: *expert_tools
    verbose: true